<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Vesper Tea three blend canister concept</title>
  <desc id="desc">Three paper canisters for First Light, Still Noon and After Rain, shown against a cool studio ground. Their labels follow the existing blend sleeve system.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur stdDeviation="18"/></filter>
    <clipPath id="a"><rect x="131" y="151" width="266" height="473" rx="24"/></clipPath>
    <clipPath id="b"><rect x="467" y="105" width="266" height="519" rx="24"/></clipPath>
    <clipPath id="c"><rect x="803" y="151" width="266" height="473" rx="24"/></clipPath>
  </defs>
  <rect width="1200" height="800" fill="#EEF1EE"/>
  <path d="M0 657H1200" stroke="#D7DFDA" stroke-width="2"/>
  <g fill="#A7B5AB" opacity=".3" filter="url(#shadow)"><ellipse cx="265" cy="662" rx="157" ry="27"/><ellipse cx="601" cy="663" rx="157" ry="27"/><ellipse cx="936" cy="662" rx="157" ry="27"/></g>
  <g id="first-light">
    <rect x="131" y="151" width="266" height="473" rx="24" fill="#F7F6F0" stroke="#D1D7CF" stroke-width="2"/>
    <g clip-path="url(#a)"><path d="M131 347H397" stroke="#054A31" stroke-width="18"/><path d="M131 566H397" stroke="#D8DFD8" stroke-width="2"/></g>
    <ellipse cx="264" cy="151" rx="133" ry="25" fill="#FDFCFA" stroke="#CDD4CD" stroke-width="2"/>
    <path d="M152 170H376" stroke="#E0E4DE" stroke-width="2"/>
    <g text-anchor="middle"><text x="264" y="231" fill="#054A31" font-family="Arial,sans-serif" font-size="24" letter-spacing="4">VESPER TEA</text><text x="264" y="435" fill="#054A31" font-family="Georgia,serif" font-size="37">First Light</text><text x="264" y="492" fill="#303B35" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">LOOSE LEAF TEA</text><text x="264" y="591" fill="#42554A" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">FICTIONAL BLEND</text></g>
  </g>
  <g id="still-noon">
    <rect x="467" y="105" width="266" height="519" rx="24" fill="#F7F6F0" stroke="#D1D7CF" stroke-width="2"/>
    <g clip-path="url(#b)"><path d="M467 329H733" stroke="#E55300" stroke-width="18"/><path d="M467 566H733" stroke="#D8DFD8" stroke-width="2"/></g>
    <ellipse cx="600" cy="105" rx="133" ry="25" fill="#FDFCFA" stroke="#CDD4CD" stroke-width="2"/>
    <path d="M488 124H712" stroke="#E0E4DE" stroke-width="2"/>
    <g text-anchor="middle"><text x="600" y="188" fill="#054A31" font-family="Arial,sans-serif" font-size="24" letter-spacing="4">VESPER TEA</text><text x="600" y="423" fill="#054A31" font-family="Georgia,serif" font-size="37">Still Noon</text><text x="600" y="482" fill="#303B35" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">LOOSE LEAF TEA</text><text x="600" y="591" fill="#42554A" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">FICTIONAL BLEND</text></g>
  </g>
  <g id="after-rain">
    <rect x="803" y="151" width="266" height="473" rx="24" fill="#F7F6F0" stroke="#D1D7CF" stroke-width="2"/>
    <g clip-path="url(#c)"><path d="M803 347H1069" stroke="#14B87A" stroke-width="18"/><path d="M803 566H1069" stroke="#D8DFD8" stroke-width="2"/></g>
    <ellipse cx="936" cy="151" rx="133" ry="25" fill="#FDFCFA" stroke="#CDD4CD" stroke-width="2"/>
    <path d="M824 170H1048" stroke="#E0E4DE" stroke-width="2"/>
    <g text-anchor="middle"><text x="936" y="231" fill="#054A31" font-family="Arial,sans-serif" font-size="24" letter-spacing="4">VESPER TEA</text><text x="936" y="435" fill="#054A31" font-family="Georgia,serif" font-size="37">After Rain</text><text x="936" y="492" fill="#303B35" font-family="Arial,sans-serif" font-size="14" letter-spacing="2">LOOSE LEAF TEA</text><text x="936" y="591" fill="#42554A" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">FICTIONAL BLEND</text></g>
  </g>
  <text x="50" y="751" fill="#58665F" font-family="Arial,sans-serif" font-size="16" letter-spacing="2">VESPER TEA / PACKAGING CONCEPT</text>
